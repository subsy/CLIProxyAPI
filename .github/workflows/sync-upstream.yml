name: sync-upstream

# Keeps this fork's main current with router-for-me/CLIProxyAPI. Every day it merges upstream's
# main; when the merge is clean and the build and tests pass, it pushes the merge to main, which
# the proxy host builds from. Anything else (a conflict, a failing test, or upstream changing a
# workflow, which GITHUB_TOKEN may not push) fails the run and leaves main alone; GitHub emails
# the failure, and hangar's check on the proxy host warns while its build lags upstream.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    if: github.repository == 'subsy/CLIProxyAPI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch --quiet upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already has upstream $(git rev-parse --short upstream/main)."
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"
          if ! git merge --no-edit upstream/main; then
            echo "::error::upstream doesn't merge cleanly; merge it by hand and push to main"
            exit 1
          fi
          if ! git diff --quiet HEAD^1 HEAD -- .github/workflows; then
            echo "::error::upstream changed a workflow, which this job's token can't push; push the merge by hand"
            exit 1
          fi

      - name: Set up Go
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and test
        if: steps.merge.outputs.changed == 'true'
        run: |
          go build ./...
          go test ./...

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
